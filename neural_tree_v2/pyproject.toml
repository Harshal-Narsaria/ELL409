[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ell409-image-correction-trees-v2"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "numpy>=1.26", "Pillow>=10", "matplotlib>=3.8", "scipy>=1.12"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["v2_tree*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

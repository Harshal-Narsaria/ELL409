[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ell409-correction-tree"
version = "0.1.0"
description = "Reproducible neural error-correction trees for ELL409"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "torchvision>=0.20", "numpy>=1.26", "Pillow>=10", "matplotlib>=3.8", "reportlab>=4", "scipy>=1.12", "psutil>=5.9"]

[project.optional-dependencies]
cats = ["tensorflow-cpu>=2.16", "tensorflow-datasets>=4.9", "importlib_resources>=6"]
test = ["pytest>=8"]

[project.scripts]
ell409-tree = "ell409_tree.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ell409_tree*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
